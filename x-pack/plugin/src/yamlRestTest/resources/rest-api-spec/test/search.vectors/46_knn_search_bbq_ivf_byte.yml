          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              vector:
                type: dense_vector
                element_type: byte
                dims: 64
                index: true
                similarity: max_inner_product
                index_options:
                  type: bbq_disk

  - do:
      index:
        index: bbq_disk_byte
        id: "1"
        body:
          vector: [10,  41, -26,  81,   4,  26,  21, -40,
                   23,  68, -48,  43,  -6,  10, -45,  35,
